# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.21", "1.27"]
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

  discover-fuzz-targets:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.discover.outputs.targets }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.27"

    - name: Discover fuzz tests
      id: discover
      run: |
        targets=$(go list ./... | while read -r pkg; do
          go test -list '^Fuzz' "$pkg" | grep '^Fuzz' | while read -r name; do
            jq -n --arg pkg "$pkg" --arg name "$name" '{package: $pkg, name: $name}'
          done
        done | jq -s -c .)
        echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: discover-fuzz-targets
    if: needs.discover-fuzz-targets.outputs.targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.discover-fuzz-targets.outputs.targets) }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.27"

    - name: Fuzz ${{ matrix.target.name }}
      run: go test -run=${{ matrix.target.name }} -fuzz=^${{ matrix.target.name }}$ -fuzztime=30s ${{ matrix.target.package }}

    - name: Upload failing corpus entry
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-failure-${{ matrix.target.name }}
        path: testdata/fuzz/${{ matrix.target.name }}
        if-no-files-found: ignore
